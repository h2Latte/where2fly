<header class="header">
  <div class="header-left">
    <div class="logo">🪂</div>
    <div class="title-block">
      <h1>Where 2 fly</h1>
      <p>Météo des sites du Nord-Pas-de-Calais</p>
    </div>
  </div>
  <div class="header-right">
    <span class="last-update">
      Mis à jour : {{ lastUpdate() | date:'dd/MM/yyyy HH:mm' }}
    </span>
    <button mat-icon-button (click)="refresh.emit()" matTooltip="Rafraîchir">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>
</header>
